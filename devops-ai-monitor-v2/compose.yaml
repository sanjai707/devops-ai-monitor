services:
  devops-ai-monitor:
    build: .
    container_name: devops-ai-monitor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      LOG_TAIL_DEFAULT: "150"
      MONITOR_POLL_INTERVAL_SECONDS: "10"
      CPU_WARNING_PERCENT: "80"
      CPU_CRITICAL_PERCENT: "95"
      MEMORY_WARNING_PERCENT: "85"
      MEMORY_CRITICAL_PERCENT: "95"
      INCIDENT_DB_PATH: "/data/incidents.db"
      INVESTIGATION_MAX_ATTEMPTS: "2"
      INVESTIGATION_RETRY_COOLDOWN_SECONDS: "60"
      INVESTIGATION_TIMEOUT_SECONDS: "180"
      DOCKER_EVENT_RETENTION_DAYS: "14"
      METRIC_RETENTION_DAYS: "7"
    volumes:
      # Docker Engine API socket. The app code only calls read operations,
      # but access to this socket is powerful; keep the API bound to localhost.
      - /var/run/docker.sock:/var/run/docker.sock
      - monitor-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
    container_name: devops-ai-monitor-dashboard
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_API_URL: "http://devops-ai-monitor:8000"
    depends_on:
      - devops-ai-monitor
    restart: unless-stopped

volumes:
  monitor-data:
