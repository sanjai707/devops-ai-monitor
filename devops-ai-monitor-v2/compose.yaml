services:
  devops-ai-monitor:
    build: .
    container_name: devops-ai-monitor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
      LOG_TAIL_DEFAULT: "150"
      MONITOR_POLL_INTERVAL_SECONDS: "10"
      CPU_WARNING_PERCENT: "80"
      CPU_CRITICAL_PERCENT: "95"
      MEMORY_WARNING_PERCENT: "85"
      MEMORY_CRITICAL_PERCENT: "95"
      INCIDENT_DB_PATH: "/data/incidents.db"
      INVESTIGATION_MAX_ATTEMPTS: "2"
      INVESTIGATION_RETRY_COOLDOWN_SECONDS: "60"
      INVESTIGATION_TIMEOUT_SECONDS: "180"
      DOCKER_EVENT_RETENTION_DAYS: "14"
      METRIC_RETENTION_DAYS: "7"
      REMEDIATION_DISABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:3000,http://localhost:3000"
      KUBERNETES_ENABLED: "false"
      AWS_ENABLED: "false"
      API_KEY: ""
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "devops-ai-monitor-api"
      OTEL_DEPLOYMENT_ENVIRONMENT: "local"
      OTEL_SEMCONV_STABILITY_OPT_IN: "http"
    volumes:
      # Docker Engine API socket. The app code only calls read operations,
      # but access to this socket is powerful; keep the API bound to localhost.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - monitor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  dashboard:
    build:
      context: ./frontend
    container_name: devops-ai-monitor-dashboard
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_API_URL: "http://devops-ai-monitor:8000"
    depends_on:
      - devops-ai-monitor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["telemetry"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["telemetry"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-local}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  monitor-data: