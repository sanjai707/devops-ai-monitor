name: CI

on:
  push:
    branches:
      - master
      - improve/incident-evaluation-reliability
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-and-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-monitor-v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-monitor-v2/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend modules and scripts
        run: python -m compileall -q .

      - name: Run backend regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate normal Compose configuration
        run: docker compose config --quiet

      - name: Validate optional telemetry Compose configuration
        run: docker compose --profile telemetry config --quiet

  frontend-and-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-monitor-v2/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: devops-ai-monitor-v2/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run browser workflow tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            devops-ai-monitor-v2/frontend/playwright-report
            devops-ai-monitor-v2/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
